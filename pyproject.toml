[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tea-asr-service"
version = "0.1.0"
description = "Local-first TEA ASR service for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "huggingface-hub>=1.0,<2",
  "mlx-audio==0.4.5",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "pydantic>=2.11,<3",
  "transformers==5.12.1",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
tea-asr = "tea_asr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tea_asr"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
markers = [
  "hardware: needs the real model on Apple Silicon; not run by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
